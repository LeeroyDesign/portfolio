<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
    <style>
        

        :root {
            --vert-principal: #000000;
            --vert-secondaire: #ffffff;
            --vert-clair: #072c3b;
            --texte-foncé: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom right, var(--vert-clair), #000000);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 60px 20px;
            background-color: var();
            color: rgb(255, 255, 255);
            box-shadow: 0 2px 90px rgb(0, 0, 0);
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
        }

        header p {
            font-size: 1.2em;
            margin-top: 10px;
        }

        .buttons {
            margin: 60px 0;
        }

        .buttons button {
            padding: 15px 35px;
            margin: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background-color: var(--vert-secondaire);
            color: rgb(0, 0, 0);
            border-radius: 30px;
            transition: background-color 0.7s ease, transform 0.5s;
            box-shadow: 0 5px 10px rgba(114, 25, 25, 0.1);
        }

        .buttons button:hover {
            background-color: #27d408a3;
            transform: scale(1.05);
        }

        footer {
            margin-top: auto;
            background-color: var(--vert-principal);
            color: white;
            padding: 20px;
            font-size: 0.9em;
            box-shadow: 0 -4px 8px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>MR Arthur</h1>
        <p>Chaque projet raconte une histoire. Voici la mienne, à travers les idées que j’ai concrétisées.</p>
    </header>

    <div class="buttons">
        <button onclick="location.href='propos.html'">À propos</button>
        <button onclick="location.href='contact.html'">Contact</button>
           <button onclick="location.href='projet.html'">Projets</button>
    </div>

    <footer>
        &copy; 2025 Mr Arthur. Tous droits réservés.
    </footer>

</body>
</html>
