<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horloge</title>
  <style>
    :root {
            --vert-principal: #000000;
            --vert-secondaire: #ffffff;
            --vert-clair: #072c3b;
            --texte-foncé: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, var(--vert-clair), #000000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: var(--texte-foncé);
    }

    header {
      position: absolute;
      top: 0;
      width: 100%;
      padding: 20px 0;
      background-color: var(--vert-principal);
      color: white;
      text-align: center;
      font-size: 1.5em;
      box-shadow: 0 2px 5px rgba(255,255,255);
    }

    .clock-container {
      background-color: rgb(0, 0, 0);
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .clock {
      font-size: 4em;
      font-weight: bold;
      color: var(--vert-secondaire);
    }

    .date {
      margin-top: 20px;
      font-size: 1.5em;
      color: var(--texte-foncé);
    }

    footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      background-color: var(--vert-principal);
      color: white;
      text-align: center;
      padding: 15px 0;
      font-size: 0.9em;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <header>
    Horloge
  </header>

  <div class="clock-container">
    <div id="clock" class="clock">00:00:00</div>
    <div id="date" class="date">1 janvier 2025</div>
  </div>

  <footer>
    &copy; 2025 Ton Nom. Tous droits réservés.
  </footer>

  <script>
    function updateClock() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      const jours = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
      const mois = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin',
                    'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

      const jourNom = jours[now.getDay()];
      const jour = now.getDate();
      const moisNom = mois[now.getMonth()];
      const annee = now.getFullYear();

      document.getElementById('date').textContent = `${jourNom} ${jour} ${moisNom} ${annee}`;
    }

    setInterval(updateClock, 1000);
    updateClock(); // Appel initial
  </script>

</body>
</html>
