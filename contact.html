<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Mon Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f1f5f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #000000;
            color: white;
            padding: 20px;
            text-align: center;
        }

        footer {
            background-color: #000000;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: auto;
        }

        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .contact-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 35px #072c3b;
            width: 100%;
            max-width: 400px;
            animation: zoomIn 0.5s ease;
        }

        .contact-container h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #072c3b;
        }

        .contact-form label {
            display: block;
            margin-top: 15px;
            color: #333;
            font-weight: 600;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #072c3b;
            border-radius: 8px;
            transition: border-color 0.5s ease;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: #01fd6a;
            outline: none;
        }

        .contact-form button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background-color: #000000;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.5s ease;
        }

        .contact-form button:hover {
            background-color: #219150;
        }

        @keyframes zoomIn {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <header>
        <h2>Mon Portfolio</h2>
        <p>Bienvenue sur ma page de contact</p>
    </header>

    <main>
        <div class="contact-container">
            <h1>Contactez-moi</h1>
            <form class="contact-form" action="#" method="post">
                <label for="name">Nom</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Sujet</label>
                <input type="text" id="subject" name="subject" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Envoyer</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Mr Arthur. Tous droits réservés.</p>
    </footer>

</body>
</html>
